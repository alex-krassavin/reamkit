name: Release

# Two ways to cut a release — both use the version already in package.json
# (bump it + the lockfile yourself, commit, and push the branch first):
#
#  A) Manual dispatch — GitHub → Actions → "Release" → "Run workflow". CI runs
#     the full gate set, creates the v<version> tag for the current commit,
#     publishes to npm with provenance, pushes the tag and opens a Release.
#  B) Tag push —  git tag v1.5.0 && git push --follow-tags
#     CI re-runs the gates, refuses to publish if the tag and package.json
#     version disagree, then publishes and opens the Release.
#
# Either way the version is never bumped here; it comes from package.json. The
# dispatch path tags the current commit (which must already be pushed, so the
# provenance attestation references a public source); the tag is pushed only
# after a successful publish, so a failed publish never leaves a dangling tag.
#
# Prereleases (a version with a hyphen, e.g. 1.5.0-alpha.1) publish to a
# non-default npm dist-tag, so a plain `npm install reamkit` never pulls one.
#
# Publishing goes through npm Trusted Publishing (OIDC): no npm token is stored
# in the repo. npm trades this job's GitHub OIDC token (id-token: write) for a
# short-lived credential that can publish `reamkit` only, and only from this
# workflow file, and attaches the provenance attestation itself. One-time setup
# on npmjs.com: reamkit → Settings → Trusted publishing → GitHub Actions, with
# organization or user `alex-krassavin`, repository `reamkit`, workflow
# filename `release.yml`, no environment, and direct `npm publish` allowed. A
# new trusted publisher expires unless it publishes within 2 days, so add it
# just before a release. Needs npm >= 11.5.1; the job installs npm 12.
#
# Rollback, until the first token-less publish has succeeded: put
#     env:
#       NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# back on the publish step (npm tries OIDC first and falls back to the token).
# Granular tokens that bypass 2FA lose direct publishing around January 2027;
# after that a token can only stage a publish (`npm stage publish`), which a
# maintainer approves with 2FA on npmjs.com.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # push the tag + create the GitHub Release
  id-token: write # trusted publishing to npm, and its provenance attestation

# Never run two releases at once; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # npm 12 (node 24 still bundles npm 11): a dependency's install scripts
      # run only if package.json's allowScripts allows them, so none run in
      # the job that publishes.
      - run: npm install -g npm@12
      - run: npm ci

      # Full gates before anything is tagged, published, or pushed.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:build
      - run: npm test

      # The version comes from package.json. On a manual dispatch we create the
      # matching tag locally (pushed later, after publish); on a tag push we just
      # verify it agrees with package.json.
      - name: Resolve release tag
        id: rel
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG already exists — bump package.json first"; exit 1
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Ream $VERSION"
          else
            if [ "$TAG" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ($TAG)"; exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Trusted publishing: no token. Provenance needs no flag either: npm adds
      # it under OIDC, and publishConfig.provenance in package.json makes it
      # mandatory (the publish fails rather than going out without it).
      - name: Publish to npm (trusted publishing, provenance)
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=$(printf '%s' "$VERSION" | sed -E 's/^[0-9.]+-([A-Za-z]+).*/\1/; t; s/.*/next/') ;;
            *)   TAG=latest ;;
          esac
          echo "Publishing $VERSION to dist-tag '$TAG' with npm $(npm --version)"
          npm publish --access public --tag "$TAG"

      # Publish succeeded — push the tag (dispatch only; a tag push already has it).
      - name: Push the tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "${{ steps.rel.outputs.tag }}"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          PRE=""
          case "${{ steps.rel.outputs.tag }}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${{ steps.rel.outputs.tag }}" --generate-notes --verify-tag $PRE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
